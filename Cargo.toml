[package]
name = "berth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6"
dispatch2 = "0.3.1"
libc = "0.2.191"
notify = "8.2.0"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-virtualization = "0.3.2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[workspace]
members = [".", "agent"]

[profile.release]
strip = true
