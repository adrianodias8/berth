#cloud-config
# Provisioning for the berth guest. Rendered by provision.rs: @USER@, @UID@,
# @HOME@ and @SSH_KEY@ are substituted at first start.
hostname: berth
manage_etc_hosts: true

users:
  - name: @USER@
    uid: @UID@
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - @SSH_KEY@

# macOS home directory and Rosetta, both shared over virtiofs. The home mount
# uses the same path as on the host so `docker run -v $PWD:/src` just works.
mounts:
  - [home, "@HOME@", virtiofs, "rw,nofail", "0", "0"]
  - [rosetta, /mnt/rosetta, virtiofs, "ro,nofail", "0", "0"]

# Docker Engine itself (docker-ce from Docker's repository) is installed by
# the guest agent on first boot; see agent/src/engine.rs.
package_update: true

write_files:
  # Don't zero pages on allocation: the memory balloon allocates the pages it
  # takes back, and zeroing them would make macOS back them with real memory.
  - path: /etc/default/grub.d/90-berth.cfg
    content: |
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT init_on_alloc=0"
  # Run x86-64 Linux binaries through Rosetta.
  - path: /etc/binfmt.d/rosetta.conf
    content: |
      :rosetta:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00:\xff\xff\xff\xff\xff\xfe\xfe\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/mnt/rosetta/rosetta:OCF
  - path: /etc/systemd/system/systemd-binfmt.service.d/rosetta.conf
    content: |
      [Unit]
      RequiresMountsFor=/mnt/rosetta
  # The guest agent bridges host vsock connections to guest sockets (Docker,
  # SSH, published ports). The host refreshes the binary on every start, in the
  # shared home directory, so updates need no re-provisioning.
  - path: /etc/systemd/system/berth-agent.service
    content: |
      [Unit]
      Description=berth guest agent
      RequiresMountsFor=@HOME@

      [Service]
      ExecStart=@HOME@/.berth/guest/berth-agent
      Restart=always
      RestartSec=1

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [update-grub]
  - [systemctl, daemon-reload]
  - [systemctl, restart, systemd-binfmt]
  - [groupadd, -f, docker]
  - [usermod, -aG, docker, "@USER@"]
  - [systemctl, enable, --now, berth-agent]
